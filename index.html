<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rate My Service</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff8fb;
      color: #292329;
      line-height: 1.5;
    }

    header {
      background: white;
      border-bottom: 1px solid #eee;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #292329;
    }

    .logo span {
      color: #d95f91;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #444;
      font-weight: 600;
      cursor: pointer;
    }

    nav a:hover {
      color: #d95f91;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
      background: linear-gradient(180deg, #fff8fb, #ffffff);
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #d95f91;
    }

    .hero p {
      font-size: 18px;
      color: #756b71;
      margin-bottom: 30px;
    }

    .search-box {
      max-width: 650px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    .search-btn {
      background: #d95f91;
      color: white;
      padding: 0 25px;
      border-radius: 12px;
    }

    .categories {
      padding: 50px 7%;
      text-align: center;
    }

    .categories h2 {
      margin-bottom: 25px;
    }

    .category-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .category-buttons button {
      background: white;
      border: 1px solid #f0b8cd;
      color: #c44d7e;
      padding: 12px 20px;
      border-radius: 30px;
    }

    .category-buttons button:hover {
      background: #d95f91;
      color: white;
    }

    #searchMessage {
      display: none;
      max-width: 900px;
      margin: 20px auto;
      padding: 15px;
      background: #fff0f6;
      border-radius: 12px;
      text-align: center;
      color: #a43d69;
    }

    #results {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px 60px;
    }

    .provider-card {
      background: white;
      border: 1px solid #f3d5e1;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 18px;
      box-shadow: 0 5px 15px rgba(0,0,0,.05);
    }

    .provider-card h3 {
      color: #c44d7e;
      font-size: 22px;
      margin-bottom: 5px;
    }

    .provider-category {
      color: #777;
      margin-bottom: 8px;
    }

    .rating {
      color: #c44d7e;
      font-weight: 700;
      margin: 8px 0;
    }

    .location {
      color: #666;
      margin-bottom: 15px;
    }

    .view-btn {
      background: #d95f91;
      color: white;
      padding: 11px 20px;
      border-radius: 10px;
    }

    .reviews {
      max-width: 900px;
      margin: 20px auto 60px;
      padding: 0 20px;
    }

    .review-card {
      background: white;
      border: 1px solid #f3d5e1;
      border-radius: 16px;
      padding: 20px;
      margin-top: 15px;
    }

    .review-card h4 {
      color: #c44d7e;
      font-size: 18px;
    }

    .verified {
      color: #37956f;
      font-weight: 700;
      margin-top: 8px;
    }

    .helpful-btn {
      background: #fff0f6;
      color: #c44d7e;
      padding: 9px 15px;
      border-radius: 20px;
      margin-top: 12px;
    }

    .form-section {
      max-width: 700px;
      margin: 50px auto;
      padding: 30px 20px;
    }

    .form-section h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .form-section input,
    .form-section textarea,
    .form-section select {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .form-section textarea {
      min-height: 130px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: #d95f91;
      color: white;
      border-radius: 10px;
      font-size: 16px;
    }

    footer {
      text-align: center;
      padding: 30px;
      background: white;
      border-top: 1px solid #eee;
      color: #777;
    }

    @media (max-width: 700px) {
      .hero h1 {
        font-size: 36px;
      }

      .search-box {
        flex-direction: column;
      }

      .search-btn {
        padding: 14px;
      }

      header {
        padding: 15px 5%;
      }

      nav a {
        margin-left: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Rate My <span>Service</span></div>

  <nav>
    <a onclick="goHome()">Home</a>
    <a onclick="showCategories()">Services</a>
    <a onclick="showReviewForm()">Write a Review</a>
  </nav>
</header>


<section class="hero" id="home">

  <h1>Find a service you can <span>trust.</span></h1>

  <p>
    Real experiences. Real reviews. Better decisions.
  </p>

  <div class="search-box">
    <input
      id="searchInput"
      type="text"
      placeholder="Search provider, service, or city..."
    >

    <button class="search-btn" onclick="searchServices()">
      Search
    </button>
  </div>

</section>


<div id="searchMessage"></div>

<section class="categories" id="categories">

  <h2>Browse Services</h2>

  <div class="category-buttons">

    <button onclick="chooseCategory('Hair')">
      💇🏽‍♀️ Hair
    </button>

    <button onclick="chooseCategory('Nails')">
      💅🏽 Nails
    </button>

    <button onclick="chooseCategory('Makeup')">
      💄 Makeup
    </button>

    <button onclick="chooseCategory('Barber')">
      💈 Barber
    </button>

    <button onclick="chooseCategory('Lashes')">
      👁️ Lashes
    </button>

    <button onclick="chooseCategory('Braids')">
      🪮 Braids
    </button>

  </div>

</section>


<section id="results"></section>


<section class="form-section" id="reviewForm">

  <h2>Share Your Experience 💗</h2>

  <input id="reviewerName" placeholder="Your name">

  <input id="providerName" placeholder="Provider's name">

  <input id="serviceName" placeholder="Service you received">

  <input
    id="pricePaid"
    type="number"
    placeholder="Price paid"
  >

  <select id="rating">
    <option value="">Choose a rating</option>
    <option value="5">⭐⭐⭐⭐⭐ 5</option>
    <option value="4">⭐⭐⭐⭐ 4</option>
    <option value="3">⭐⭐⭐ 3</option>
    <option value="2">⭐⭐ 2</option>
    <option value="1">⭐ 1</option>
  </select>

  <textarea
    id="reviewText"
    placeholder="Tell us about your experience..."
  ></textarea>

  <button class="submit-btn" onclick="submitReview()">
    Submit Review
  </button>

</section>


<footer>
  © 2026 Rate My Service
</footer>


<script>

  /* =========================
     SUPABASE CONNECTION
  ========================= */

  const SUPABASE_URL = "https://suysredirdcgzqoqvopl.supabase.co/";

  const SUPABASE_KEY = "sb_publishable_jh3z6yXmHMtvXUr8uVziBw_22I3A7kJ";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     SEARCH PROVIDERS
  ========================= */

  async function searchServices() {

    const input =
      document.getElementById("searchInput");

    const message =
      document.getElementById("searchMessage");

    const results =
      document.getElementById("results");

    const search =
      input.value.trim();

    if (!search) {

      message.style.display = "block";

      message.textContent =
        "Type a provider, service, or city to search.";

      return;
    }

    message.style.display = "block";

    message.textContent =
      "Searching for providers...";

    results.innerHTML = "";

    const safeSearch =
      search.replace(/,/g, "");

    const { data, error } =
      await supabaseClient
        .from("providers")
        .select("*")
        .or(
          `name.ilike.%${safeSearch}%,category.ilike.%${safeSearch}%,city.ilike.%${safeSearch}%`
        );

    if (error) {

      console.error(error);

      message.textContent =
        "Something went wrong while searching.";

      return;
    }

    if (!data || data.length === 0) {

      message.textContent =
        `No providers found for "${search}".`;

      return;
    }

    message.style.display = "none";

    await displayProviders(data);

    results.scrollIntoView({
      behavior: "smooth"
    });
  }


  /* =========================
     DISPLAY PROVIDERS
  ========================= */

  async function displayProviders(providers) {

    const results =
      document.getElementById("results");

    const cards = [];

    for (const provider of providers) {

      const { data: reviews, error } =
        await supabaseClient
          .from("reviews")
          .select("rating")
          .eq("provider_id", provider.id);

      if (error) {
        console.error(error);
      }

      const reviewList = reviews || [];

      const reviewCount =
        reviewList.length;

      const averageRating =
        reviewCount > 0
          ? (
              reviewList.reduce(
                (sum, review) =>
                  sum + Number(review.rating || 0),
                0
              ) / reviewCount
            ).toFixed(1)
          : "0.0";

      cards.push(`

        <div class="provider-card">

          <h3>
            ${escapeHTML(provider.name || "Unnamed provider")}
          </h3>

          <div class="provider-category">
            💇🏽‍♀️ ${escapeHTML(provider.category || "Service")}
          </div>

          <div class="rating">
            ⭐ ${averageRating}
            · ${reviewCount}
            ${reviewCount === 1 ? "review" : "reviews"}
          </div>

          <div class="location">
            📍 ${escapeHTML(provider.city || "Location not listed")}
          </div>

          <button
            class="view-btn"
            onclick="viewReviews('${provider.id}')"
          >
            View Reviews
          </button>

        </div>

      `);
    }

    results.innerHTML =
      cards.join("");
  }


  /* =========================
     VIEW REVIEWS
  ========================= */

  async function viewReviews(providerId) {

    const results =
      document.getElementById("results");

    results.innerHTML =
      "<h2>Reviews</h2><p>Loading reviews...</p>";

    const { data, error } =
      await supabaseClient
        .from("reviews")
        .select("*")
        .eq("provider_id", providerId)
        .order("created_at", {
          ascending: false
        });

    if (error) {

      console.error(error);

      results.innerHTML =
        "<p>Something went wrong loading the reviews.</p>";

      return;
    }

    if (!data || data.length === 0) {

      results.innerHTML = `

        <div class="review-card">

          <h3>No reviews yet.</h3>

          <p>
            Be the first person to review this provider!
          </p>

        </div>

      `;

      return;
    }

    let html = "<h2>Reviews</h2>";

    data.forEach(review => {

      html += `

        <div class="review-card">

          <h4>
            ${escapeHTML(
              review.reviewer_name || "Anonymous"
            )}
          </h4>

          <div class="rating">
            ⭐ ${review.rating || "No rating"}
          </div>

          <p>
            ${escapeHTML(
              review.review_text || ""
            )}
          </p>

          ${
            review.service
              ? `<p>Service: ${escapeHTML(review.service)}</p>`
              : ""
          }

          ${
            review.price_paid
              ? `<p>Price: $${review.price_paid}</p>`
              : ""
          }

          ${
            review.verified
              ? `<div class="verified">
                   ✓ Verified review
                 </div>`
              : ""
          }

          <button
            class="helpful-btn"
            onclick="markHelpful('${review.id}')"
          >
            👍 ${review.helpful_count || 0}
            ${
              Number(review.helpful_count || 0) === 1
                ? "person"
                : "people"
            }
            found this helpful
          </button>

        </div>

      `;
    });

    results.innerHTML = html;

    results.scrollIntoView({
      behavior: "smooth"
    });
  }


  /* =========================
     HELPFUL BUTTON
  ========================= */

  async function markHelpful(reviewId) {

    const { data, error } =
      await supabaseClient
        .from("reviews")
        .select("helpful_count")
        .eq("id", reviewId)
        .single();

    if (error) {

      console.error(error);

      alert("Something went wrong.");

      return;
    }

    const newCount =
      Number(data.helpful_count || 0) + 1;

    const { error: updateError } =
      await supabaseClient
        .from("reviews")
        .update({
          helpful_count: newCount
        })
        .eq("id", reviewId);

    if (updateError) {

      console.error(updateError);

      alert("Could not mark this review as helpful.");

      return;
    }

    alert("Thanks! 💗");

    location.reload();
  }


  /* =========================
     CATEGORY SEARCH
  ========================= */

  async function chooseCategory(category) {

    const message =
      document.getElementById("searchMessage");

    const results =
      document.getElementById("results");

    message.style.display = "block";

    message.textContent =
      `Searching for ${category} providers...`;

    results.innerHTML = "";

    const { data, error } =
      await supabaseClient
        .from("providers")
        .select("*")
        .ilike("category", `%${category}%`);

    if (error) {

      console.error(error);

      message.textContent =
        "Something went wrong.";

      return;
    }

    if (!data || data.length === 0) {

      message.textContent =
        `No ${category} providers found yet.`;

      return;
    }

    message.style.display = "none";

    await displayProviders(data);

    results.scrollIntoView({
      behavior: "smooth"
    });
  }


  /* =========================
     WRITE REVIEW
  ========================= */

  function showReviewForm() {

    document
      .getElementById("reviewForm")
      .scrollIntoView({
        behavior: "smooth"
      });
  }


  async function submitReview() {

    const reviewerName =
      document.getElementById("reviewerName").value.trim();

    const providerName =
      document.getElementById("providerName").value.trim();

    const service =
      document.getElementById("serviceName").value.trim();

    const price =
      document.getElementById("pricePaid").value;

    const rating =
      document.getElementById("rating").value;

    const reviewText =
      document.getElementById("reviewText").value.trim();


    if (
      !reviewerName ||
      !providerName ||
      !service ||
      !rating ||
      !reviewText
    ) {

      alert("Please fill out all required fields.");

      return;
    }


    const { data: provider, error: providerError } =
      await supabaseClient
        .from("providers")
        .select("id")
        .ilike("name", providerName)
        .limit(1)
        .maybeSingle();


    if (providerError) {

      console.error(providerError);

      alert("Could not find the provider.");

      return;
    }


    if (!provider) {

      alert(
        "That provider is not in our database yet."
      );

      return;
    }


    const { error } =
      await supabaseClient
        .from("reviews")
        .insert({

          provider_id: provider.id,

          reviewer_name: reviewerName,

          rating: Number(rating),

          review_text: reviewText,

          service: service,

          price_paid: price
            ? Number(price)
            : null,

          helpful_count: 0,

          verified: false

        });


    if (error) {

      console.error(error);

      alert(
        "We couldn't submit your review. Please try again."
      );

      return;
    }


    alert(
      "Review submitted successfully! 💗"
    );


    document
      .getElementById("reviewerName")
      .value = "";

    document
      .getElementById("providerName")
      .value = "";

    document
      .getElementById("serviceName")
      .value = "";

    document
      .getElementById("pricePaid")
      .value = "";

    document
      .getElementById("rating")
      .value = "";

    document
      .getElementById("reviewText")
      .value = "";
  }


  /* =========================
     NAVIGATION
  ========================= */

  function goHome() {

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  function showCategories() {

    document
      .getElementById("categories")
      .scrollIntoView({
        behavior: "smooth"
      });
  }


  /* =========================
     SECURITY / TEXT CLEANUP
  ========================= */

  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      String(value ?? "");

    return div.innerHTML;
  }


  console.log("Rate My Service loaded successfully 💗");

</script>

</body>
</html>
