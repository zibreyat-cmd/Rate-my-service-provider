<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate My Service</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff8fb;
      color: #292329;
      line-height: 1.5;
    }

    header {
      background: white;
      border-bottom: 1px solid #eee;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #292329;
    }

    .logo span { color: #d95f91; }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #444;
      font-weight: 600;
      cursor: pointer;
    }

    nav a:hover { color: #d95f91; }

    .hero {
      text-align: center;
      padding: 80px 20px;
      background: linear-gradient(180deg, #fff8fb, #fff);
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .hero h1 span { color: #d95f91; }

    .hero p {
      font-size: 18px;
      color: #756b71;
      margin-bottom: 30px;
    }

    .search-box {
      max-width: 650px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    .search-btn, .view-btn, .submit-btn {
      background: #d95f91;
      color: white;
    }

    .search-btn {
      padding: 0 25px;
      border-radius: 12px;
    }

    .categories {
      padding: 64px 7% 76px;
      text-align: center;
      background: #fff;
    }

    .section-eyebrow {
      color: #c44d7e;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .categories h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .categories-intro {
      color: #756b71;
      margin: 0 auto 30px;
      max-width: 560px;
    }

    .category-buttons {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      max-width: 1050px;
      margin: 0 auto;
    }

    .category-buttons button {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      text-align: left;
      padding: 24px;
      background: linear-gradient(145deg, #fff, #fff4f8);
      border: 1px solid #f2cddd;
      border-radius: 20px;
      color: #292329;
      box-shadow: 0 7px 20px rgba(173, 73, 116, .07);
      transition: .18s ease;
    }

    .category-buttons button:hover {
      background: linear-gradient(145deg, #fff0f6, #ffe4ef);
      border-color: #d95f91;
      box-shadow: 0 12px 26px rgba(173, 73, 116, .14);
      transform: translateY(-4px);
    }

    .category-icon {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 17px;
      background: #ffe4ef;
      font-size: 30px;
    }

    .category-copy strong {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }

    .category-copy span {
      display: block;
      color: #756b71;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.45;
    }

    .category-arrow {
      align-self: flex-end;
      color: #c44d7e;
      font-size: 22px;
    }

    #results {
      width: min(900px, 92%);
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px 60px;
      scroll-margin-top: 100px;
    }

    #results:empty { display: none; }

    #searchMessage {
      display: none;
      max-width: 900px;
      margin: 20px auto;
      padding: 15px;
      background: #fff0f6;
      border-radius: 12px;
      text-align: center;
      color: #a43d69;
    }

    .provider-card {
      background: white;
      border: 1px solid #f3d5e1;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 18px;
      box-shadow: 0 5px 15px rgba(0,0,0,.05);
    }

    .provider-card h3 {
      color: #c44d7e;
      font-size: 22px;
      margin-bottom: 5px;
    }

    .provider-category, .profile-meta {
      color: #777;
      margin-bottom: 8px;
    }

    .rating {
      color: #c44d7e;
      font-weight: 700;
      margin: 8px 0;
    }

    .location {
      color: #666;
      margin-bottom: 15px;
    }

    .view-btn {
      padding: 11px 20px;
      border-radius: 10px;
    }

    .profile-header {
      background: linear-gradient(135deg, #fff0f6, #fff);
      border: 1px solid #f3d5e1;
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 24px;
    }

    .profile-header h2 {
      color: #c44d
